# A tiny HTTP service with a health check. Images are pinned by digest and
# registered in docs/security/components.md (test images).
services:
  web:
    image: mirror.gcr.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["sh", "-c", "mkdir -p /www && echo ${GREETING:-hello} > /www/index.html && echo web started && exec httpd -f -vv -p 8080 -h /www"]
    ports: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 1s
      timeout: 2s
      retries: 30
