name: Android comparison

# uiautomator2 against Appium on one emulator (M5c, docs/design/decisions/14):
# scripts/bench_android.py. Not a gate on every PR -- it installs the Appium
# server and its driver from npm, which nothing else needs -- so it runs when
# what it measures with changes, and by hand.
on:
  pull_request:
    paths:
      - 'bench/android/**'
      - 'scripts/bench_android.py'
      - 'requirements/bench.txt'
      - '.github/workflows/android-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/bench.txt

      # Both sides hashed: requirements/bench.txt (pip --require-hashes) and
      # bench/android/package-lock.json (npm ci checks every sha512). No npm
      # install scripts run; optional packages (sharp's LGPL libvips) are not
      # installed. Admitted in docs/security/components.md.
      - name: Install
        run: |
          pip install --require-hashes -r requirements/bench.txt
          pip install --no-deps --no-build-isolation -e .
          node --version
          npm --version
          (cd bench/android && npm ci --omit=optional --ignore-scripts --no-audit --no-fund)

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash bench/android/run.sh "$RUNNER_TEMP/android-bench.json" "$GITHUB_STEP_SUMMARY"

      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bench
          path: |
            ${{ runner.temp }}/android-bench.json
            ${{ runner.temp }}/android-bench-appium.log
          if-no-files-found: ignore
