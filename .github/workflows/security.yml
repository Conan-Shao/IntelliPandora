name: Security

# Every PR, every merge to main, and once a day. The daily run is the one that
# matters most: a new advisory against a dependency we already use changes
# nothing in this repository, so no other trigger would ever notice it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# What runs and what blocks: scripts/security_report.py. What the rules are:
# docs/design/decisions/15-第三方组件安全准入与漏洞扫描.md. The published result:
# docs/security/report.md.
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      # Three environments: the scanners, what a user gets (the framework
      # with every optional group), and the Android comparison job's. Licenses
      # are read from the last two. npm (preinstalled on the runner) audits
      # bench/android/package-lock.json; nothing from it is installed here.
      - name: Install scanners and the environments to check
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --require-hashes -r requirements/tools.txt
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install --require-hashes -r requirements/ci.txt
          "$RUNNER_TEMP/runtime/bin/pip" install --no-deps --no-build-isolation -e .
          python -m venv "$RUNNER_TEMP/bench"
          "$RUNNER_TEMP/bench/bin/pip" install --require-hashes -r requirements/bench.txt
          "$RUNNER_TEMP/bench/bin/pip" install --no-deps --no-build-isolation -e .
          npm --version

      # Exit 1: something was found -- the report is still written and shown.
      # Exit 2: a scan could not run -- nothing is written, nothing published.
      - name: Scan
        run: |
          "$RUNNER_TEMP/tools/bin/python" scripts/security_report.py \
            --runtime-python "$RUNNER_TEMP/runtime/bin/python" \
            --bench-python "$RUNNER_TEMP/bench/bin/python"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: docs/security/report.md
          if-no-files-found: ignore

  # Proposes the regenerated report as a PR when it changed. A separate job so
  # that the write token never exists where third-party packages run. Never on
  # pull_request: a PR's report is in its job summary; the published one
  # describes main.
  #
  # Two repository settings decide whether the PR can be opened (see
  # docs/dev/IntelliPandora_Dev.md, 安全扫描): "Allow GitHub Actions to create
  # and approve pull requests" must be on. And a PR opened with GITHUB_TOKEN
  # does not start other workflows, so its checks appear only after a
  # maintainer closes and reopens it.
  publish:
    needs: scan
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.scan.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-report
          path: docs/security

      - name: Propose the updated report
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: security-report/update
        run: |
          if git diff --quiet -- docs/security/report.md; then
            echo "report unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add docs/security/report.md
          git commit -m "docs(security): update the security report"
          git push --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            echo "updated the open PR for $BRANCH"
          elif ! gh pr create --base main --head "$BRANCH" \
                 --title "docs(security): update the security report" \
                 --body "Generated by the Security workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The scan status changed; review the diff of docs/security/report.md. Checks do not start on a PR opened by GITHUB_TOKEN: close and reopen it to run them."; then
            echo "::warning::could not open a PR. Pushed $BRANCH; open it by hand, or enable 'Allow GitHub Actions to create and approve pull requests'."
          fi
