name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[ai,mcp]"

      # Guards against the v1.1.0 class of bug: modules that raise at import
      # time. No test touched them, so nothing caught it.
      - name: Import smoke test
        run: python scripts/smoke_import.py

      - name: Tests
        run: pytest test/ -v

  # LLM support must stay optional. If deleting ai/ breaks the suite, then
  # something in core/ grew a dependency on it.
  # See docs/design/03-LLM接入边界.md
  test-without-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install without AI extra
        run: pip install -e ".[mcp]"

      # Only the package is removed. Deleting test/testai along with it -- which
      # this step used to do -- meant the check could pass even if the suite
      # could not actually survive the removal; those tests now skip themselves.
      - name: Remove ai/ and run the suite
        run: |
          rm -rf src/ipandora/ai
          pytest test/ -v

  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # AST-based, so documentation that mentions ipandora.ai does not trip it
      - name: core/ must not import ai/
        run: python scripts/check_layering.py

      # This used to be a second, weaker grep written inline here, over src/
      # alone, while the real check (scripts/check_secrets.py) ran only in
      # pre-commit -- which is opt-in per machine, so in practice nothing
      # gated. One implementation now, over every tracked file.
      #
      # -z / xargs -0 is load-bearing: git quotes paths holding non-ASCII
      # characters, and most design docs are named in Chinese. Splitting that
      # output on whitespace hands the script unopenable paths, which it skips
      # in silence -- a gate that scans nothing and reports clean.
      - name: No hardcoded secrets
        run: |
          git -c core.quotepath=false ls-files -z \
            | xargs -0 --no-run-if-empty python scripts/check_secrets.py
          echo "OK: no hardcoded credentials"

  # The wheel on PyPI carries conf/__init__.py and none of the data files
  # beside it -- no config.yaml, no report templates -- so an installed copy
  # cannot render a report. The test suite cannot see this: it runs from an
  # editable install, where those files are simply there in the source tree.
  # Whether they reach the artifact depends on the setuptools version doing
  # the build, which is not pinned by anything in this repo. So: look inside
  # the wheel. See scripts/check_packaging.py.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build frontend
        run: pip install build

      - name: Required data files must reach the wheel
        run: python scripts/check_packaging.py
