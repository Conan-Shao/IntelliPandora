name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes. Third-party code runs in these jobs (every installed
# package), so the token they can reach is read-only.
permissions:
  contents: read

# Actions are pinned to a commit SHA, never a tag: a tag can be moved to point
# at different code, a SHA cannot. The comment names the version for humans
# and for scripts/check_components.py, which checks the pin against
# docs/security/components.md. Dependencies come from the hashed lock files
# under requirements/, so CI installs exactly what was reviewed. See
# docs/design/decisions/15-第三方组件安全准入与漏洞扫描.md.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt

      # --no-deps --no-build-isolation: the lock already holds every dependency
      # and the build backend; letting pip resolve here would fetch unhashed.
      - name: Install
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .

      # The browser the locked Playwright version was built against; it is
      # not a Python package, so it is not in the lock. IPANDORA_REQUIRE_BROWSER
      # makes the web tests fail instead of skipping when it is missing: a
      # suite that quietly skips its browser tests in CI tests nothing.
      - name: Install the browser for the web tests
        run: python -m playwright install --with-deps chromium-headless-shell

      # Every relative link resolves, and docs/reference/ -- generated from
      # the argparse definitions and config.yaml -- matches the code. Here
      # rather than in `layering`: generating the CLI reference imports the
      # package. The guide's code examples are run by test/testdocs.
      - name: Docs are current
        run: python scripts/check_docs.py

      # Guards against the v1.1.0 class of bug: modules that raise at import
      # time. No test touched them, so nothing caught it.
      - name: Import smoke test
        run: python scripts/smoke_import.py

      - name: Tests
        env:
          IPANDORA_REQUIRE_BROWSER: '1'
        run: pytest test/ -v

  # LLM support must stay optional. If deleting ai/ breaks the suite, then
  # something in core/ grew a dependency on it.
  # See docs/design/decisions/03-LLM接入边界.md
  test-without-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci-noai.txt

      - name: Install without AI extra
        run: |
          pip install --require-hashes -r requirements/ci-noai.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Install the browser for the web tests
        run: python -m playwright install --with-deps chromium-headless-shell

      # Only the package is removed. Deleting test/testai along with it -- which
      # this step used to do -- meant the check could pass even if the suite
      # could not actually survive the removal; those tests now skip themselves.
      - name: Remove ai/ and run the suite
        run: |
          rm -rf src/ipandora/ai
          IPANDORA_REQUIRE_BROWSER=1 pytest test/ -v

  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # AST-based, so documentation that mentions ipandora.ai does not trip it
      - name: core/ must not import ai/
        run: python scripts/check_layering.py

      # Every dependency and action is in docs/security/components.md, with
      # the same version spec, and no vulnerability exception has expired.
      # Standard library only, so it runs before anything is installed.
      - name: Components are registered
        run: python scripts/check_components.py

      # This used to be a second, weaker grep written inline here, over src/
      # alone, while the real check (scripts/check_secrets.py) ran only in
      # pre-commit -- which is opt-in per machine, so in practice nothing
      # gated. One implementation now, over every tracked file.
      #
      # -z / xargs -0 is load-bearing: git quotes paths holding non-ASCII
      # characters, and most design docs are named in Chinese. Splitting that
      # output on whitespace hands the script unopenable paths, which it skips
      # in silence -- a gate that scans nothing and reports clean.
      - name: No hardcoded secrets
        run: |
          git -c core.quotepath=false ls-files -z \
            | xargs -0 --no-run-if-empty python scripts/check_secrets.py
          echo "OK: no hardcoded credentials"

  # The wheel on PyPI carries conf/__init__.py and none of the data files
  # beside it -- no config.yaml, no report templates -- so an installed copy
  # cannot render a report. The test suite cannot see this: it runs from an
  # editable install, where those files are simply there in the source tree.
  # Whether they reach the artifact depends on the setuptools version doing
  # the build, which is not pinned by anything in this repo. So: look inside
  # the wheel. See scripts/check_packaging.py.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/tools.txt

      - name: Install build tools
        run: pip install --require-hashes -r requirements/tools.txt

      # --no-isolation builds with the hashed setuptools just installed, the
      # same way release.yml builds what goes to PyPI.
      - name: Required data files must reach the wheel
        run: python scripts/check_packaging.py --no-isolation
