# The framework runs standalone: it reads this file, runs the suite, writes a
# report next to itself. There is no result upload, no results database and no
# mail step, so there is nothing here to point at a server.
#
# The `mysql`, `file`, `email`, `addressesTo` and `report` sections that used
# to sit above are gone with the code that read them.

# Transport reliability. verify defaults to true -- only turn it off for a
# specific throwaway environment, and never repo-wide.
http:
  connect_timeout: 10   # seconds to establish a connection
  read_timeout: 30      # seconds to wait for a response; every request is bounded
  verify: true          # TLS certificate verification
  max_retries: 2        # idempotent methods only (GET/HEAD/PUT/DELETE/OPTIONS/TRACE)
  backoff_factor: 0.3   # seconds; retry n waits backoff_factor * 2^(n-1)
  pool_maxsize: 10      # connections kept per host

# Web (pip install intellipandora[web]). Defaults for pytest-playwright's own
# options; a command-line --base-url / --browser, or a suite's conftest, wins.
web:
  base_url:             # e.g. https://staging.example.com, then page.goto('/orders')
  browser:              # chromium | firefox | webkit; default chromium
  viewport:             # e.g. {width: 1280, height: 720}; default Playwright's
  trace: retain-on-failure   # on | off. A trace holds request headers and bodies -- tokens and cookies -- unmasked

# Fault injection through Toxiproxy (core/faults.py). Off unless an environment
# turns it on in its conf/<env>.yaml -- local and CI only; never in prod.
faults:
  allowed: false
  toxiproxy:            # default http://127.0.0.1:8474, or $TOXIPROXY_URL

# Consistency checks on an operation history (core/consistency.py): elle-cli,
# a Java 21 tool. Not installed with the package -- see docs/guide/consistency.md.
consistency:
  elle_cli:             # path to elle-cli-0.1.11-standalone.jar, or $ELLE_CLI_JAR
  java:                 # a Java 21+ executable; default: $IPANDORA_JAVA, $JAVA_HOME_21_X64, $JAVA_HOME, PATH
  elle_cli_sha256:      # only for a build you admitted yourself; default: the admitted 0.1.11

# LLM access is OFF by default and stays that way unless explicitly enabled.
# It is never used at test-execution time -- only post-run (triage, report
# summaries). See docs/design/decisions/03-LLM接入边界.md.
# Requires the optional extra: pip install intellipandora[ai]
ai:
  enabled: false        # nothing calls an LLM unless this is true
  provider: mock        # mock | anthropic
  api_key:              # put it in conf/<env>.yaml that is not committed, never here
  model: claude-sonnet-5
  base_url:             # a gateway in front of the provider, if any
  timeout: 30           # seconds per call
  max_tokens: 1024      # per call
  max_calls_per_run: 20 # a hard cap: 0 means no calls at all

# The MCP server behind `ipandora mcp` (pip install intellipandora[mcp]).
mcp:
  enabled: true
  name: intellipandora  # the server name an agent sees
  transport: stdio      # stdio | sse | streamable-http
