mysql:
  host: localhost
  username: root
  password:
  database: TestCaseDB
file:
  host: localhost
  username: root
  password:
  directory: /var/data/test_case_attachments
email:
  host:
  port:
  username:
  password:
addressesTo:
  recipients:
    - xxx@gmail.com
report:
  host:
# LLM access is OFF by default and stays that way unless explicitly enabled.
# It is never used at test-execution time -- only post-run (triage, report
# summaries). See docs/design/03-LLM接入边界.md.
# Requires the optional extra: pip install intellipandora[ai]
ai:
  enabled: false
  provider: mock
  api_key:
  model: claude-sonnet-5
  base_url:
  timeout: 30
  max_tokens: 1024
  max_calls_per_run: 20
mcp:
  enabled: true
  name: intellipandora
  transport: stdio
