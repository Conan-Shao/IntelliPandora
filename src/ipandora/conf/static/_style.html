{#- Shared by report.html and eval.html: one look, light and dark. -#}
<style>
:root{
  --bg:#F4F5F7; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#DDE1E6; --line-soft:#EEF0F3;
  --text:#16191D; --text-2:#374151; --muted:#4B5563; --link:#1D4ED8;
  --fail:#9F1D14; --fail-bg:#FDECEA; --fail-row:#FDF3F1; --fail-mark:#C0392B;
  --pass:#1D5FAD; --pass-bg:#DCE8F7; --pass-ink:#123E73; --pass-mark:#1D5FAD;
  --warn:#7A4700; --warn-bg:#FFF4E0; --warn-line:#F0D19B; --warn-mark:#D98A00;
  --skip-mark:#9AA3AF; --chip:#EEF0F3; --solid-fail:#9F1D14; --on-solid:#FFFFFF;
  --jk:#1E5FBF; --js:#12704F; --jn:#8A5A0B; --jb:#6D45D4;
  --sans:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1216; --panel:#171B21; --panel-2:#1D222A; --line:#2C333D; --line-soft:#242A33;
    --text:#E6E9EE; --text-2:#C4CAD3; --muted:#9AA3AF; --link:#8AB4FF;
    --fail:#FF9A8C; --fail-bg:#3A1D1A; --fail-row:#2A1917; --fail-mark:#E05A4A;
    --pass:#8DB8F2; --pass-bg:#1C2C44; --pass-ink:#B9D3F7; --pass-mark:#5B8FD6;
    --warn:#F2BD6B; --warn-bg:#33270F; --warn-line:#5C4518; --warn-mark:#D98A00;
    --skip-mark:#6B7280; --chip:#242A33; --solid-fail:#C0392B; --on-solid:#FFFFFF;
    --jk:#8AB4FF; --js:#7FD3AE; --jn:#F2BD6B; --jb:#C3A6FF;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55}
a{color:var(--link)} a:hover{text-decoration:none}
code,.mono{font-family:var(--mono)}
code{overflow-wrap:anywhere}
.row>*{min-width:0;overflow-wrap:anywhere}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:14px;padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.brand{font-weight:700;font-size:16px}
.meta{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
main.wrap{padding-top:28px;padding-bottom:48px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
h1,h2,h3{margin:0}
h2{font-size:17px}
h3{font-size:15px}
.sub{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.row .end{margin-left:auto}

.verdict{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:flex-start;padding:28px 32px}
.verdict .main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.verdict h1{font-size:clamp(20px,3vw,26px);line-height:1.4}
.verdict ul{margin:0;padding-left:20px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.verdict dl{flex:1 1 300px;margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;color:var(--muted)}
.verdict dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
.verdict dd .sub{display:block}
.stamp{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;border-radius:999px;padding:4px 14px 4px 10px;font-weight:700}
.stamp.fail,.stamp.error{background:var(--fail-bg);color:var(--fail)}
.stamp.review{background:var(--warn-bg);color:var(--warn)}
.stamp.pass{background:var(--pass-bg);color:var(--pass-ink)}
.collect{margin:0;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;color:var(--text);text-decoration:none;min-width:0}
a.tile:hover{border-color:var(--muted)}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{display:flex;align-items:baseline;gap:8px}
.tile .v b{font-size:30px;line-height:1.2}
.tile .v span{font-weight:600}
.tile .d{font-size:13px;color:var(--text-2)}
.tile .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.v.fail b{color:var(--fail)} .v.warn b{color:var(--warn)}
.stack{display:flex;gap:2px;height:10px}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:4px 0 0 4px} .stack i:last-child{border-radius:0 4px 4px 0}
.stack i:only-child{border-radius:4px}
.stack .p{background:var(--pass-mark)} .stack .f{background:var(--fail-mark)}
.stack .u{background:var(--warn-mark)} .stack .k{background:var(--skip-mark)}
.flag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.ok{background:var(--chip);color:var(--text-2)}
.mini{border-collapse:separate;border-spacing:3px;font-size:12px;color:var(--text-2)}
.mini th{font-weight:500;text-align:left;padding-right:6px}
.mini td{text-align:center;border-radius:4px;padding:2px 10px;white-space:nowrap}
.mini td.hit{background:var(--pass-bg);color:var(--pass-ink)}
.mini td.miss{background:var(--chip);color:var(--muted)}

.compare{display:flex;flex-wrap:wrap;gap:24px}
.compare>div{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.compare>div+div{border-left:1px solid var(--line-soft);padding-left:24px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.num{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.num .l{font-size:13px;color:var(--muted);font-weight:600}
.num b{font-size:22px}
.num.hot{border-color:var(--fail-bg);background:var(--fail-row)}
.num.hot .l,.num.hot b{color:var(--fail)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-soft);min-width:0}
.list li>*{min-width:0;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.new{background:var(--solid-fail);color:var(--on-solid)}
.tag.plain{border:1px solid var(--skip-mark);color:var(--text-2)}
.tag.source{background:var(--chip);color:var(--text-2);font-weight:500}

.groups{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:8px}
.badge{font-weight:700;border-radius:6px;padding:2px 10px;white-space:nowrap}
.badge.sut{background:var(--fail-bg);color:var(--fail)}
.badge.ours{background:var(--chip);color:var(--text-2)}
.badge.untrusted{background:var(--warn-bg);color:var(--warn)}
.scroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--panel-2);color:var(--muted);text-align:left;font-weight:600;padding:8px 12px}
table.t td{border-top:1px solid var(--line-soft);padding:10px 12px;vertical-align:top}
table.t td .sub{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
table.t .fx{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
table.t .fx div+div{margin-top:2px}
.wide{min-width:760px}

.changes{display:flex;flex-direction:column}
.chg{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.chg .k{font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px;justify-self:start;white-space:nowrap}
.chg.weak .k{background:var(--warn-bg);color:var(--warn)}
.chg:not(.weak) .k{background:var(--chip);color:var(--text-2)}
.chg .c{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.chg .w{font-family:var(--mono);font-size:12.5px;display:block;margin-top:3px;overflow-wrap:anywhere}
.chg .w .from{color:var(--muted);text-decoration:line-through}
.chg .n{font-size:12px;color:var(--muted);display:block;margin-top:2px}

.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;min-width:420px;font-size:13px}
.matrix th,.matrix td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.matrix thead th{color:var(--muted);font-weight:600}
.cell{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;text-decoration:none;color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.cell.pass .dot{background:var(--pass-mark)} .cell.fail .dot{background:var(--fail-mark)}
.cell.fail{color:var(--fail)} .cell.skip .dot{background:var(--warn-mark)} .cell.skip{color:var(--warn)}
.cell.none{color:var(--muted)} .cell.none .dot{border:1px dashed var(--skip-mark)}
.problem{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px;overflow-wrap:anywhere}
.mix{display:grid;gap:9px;margin-top:12px}
.mixrow{display:grid;grid-template-columns:96px 1fr 120px;gap:12px;align-items:center;font-size:13px}
.mixrow .n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.bar{display:flex;gap:2px;height:9px}
.bar i{display:block;height:100%;border-radius:2px}
.bar .ok{background:var(--pass-mark)} .bar .bad{background:var(--fail-mark)} .bar .gp{background:var(--warn-mark)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--text-2);min-height:36px;padding:0 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--panel);border-color:var(--text)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.band{font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 8px;font-family:var(--mono)}
.cases{display:flex;flex-direction:column;gap:8px}
details.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:16px}
details.case>summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center}
details.case>summary::-webkit-details-marker{display:none}
details.case>summary:hover{background:var(--panel-2)}
.st{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;text-align:center;white-space:nowrap}
.st.PASS{background:var(--pass-bg);color:var(--pass-ink)}
.st.FAIL,.st.ERROR{background:var(--fail-bg);color:var(--fail)}
.st.UNVERIFIED,.st.GAP{background:var(--warn-bg);color:var(--warn)}
.st.SKIPPED,.st.BLOCKED{background:var(--chip);color:var(--text-2)}
.ct{font-weight:600;overflow-wrap:anywhere}
.cid{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:12px;color:var(--muted)}
.pills span{border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.body{border-top:1px solid var(--line-soft);padding:18px;display:flex;flex-direction:column;gap:14px}
.why{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.why.bad{background:var(--fail-row)} .why.warn{background:var(--warn-bg)}
.why .cat{font-size:12px;font-weight:700}
.why.bad .cat{color:var(--fail)} .why.warn .cat{color:var(--warn)}
.why .n{font-size:13px;color:var(--text-2)}
.checks{width:100%;border-collapse:collapse;font-size:13px}
.checks th{color:var(--muted);text-align:left;font-weight:600;padding:6px 8px}
.checks td{border-top:1px solid var(--line-soft);padding:8px;vertical-align:top}
.checks tr.bad td{background:var(--fail-row)} .checks tr.gap td{background:var(--warn-bg)}
.checks .r{font-weight:700;white-space:nowrap}
.checks tr.bad .r{color:var(--fail)} .checks tr.ok .r{color:var(--pass)} .checks tr.gap .r{color:var(--warn)}
.checks .e{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.checks .s{color:var(--muted);font-size:12px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
details.step{border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
details.step+details.step{margin-top:6px}
details.step>summary{list-style:none;cursor:pointer;padding:8px 12px;display:grid;grid-template-columns:58px minmax(0,1fr) 54px 72px;gap:12px;align-items:center;font-family:var(--mono);font-size:12.5px}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary:hover{background:var(--panel-2)}
.verb{font-weight:700}
.url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-n{font-weight:700;text-align:right} .code-n.ok{color:var(--pass)} .code-n.bad{color:var(--fail)}
.ms{color:var(--muted);text-align:right}
.io{border-top:1px solid var(--line-soft);background:var(--panel-2);padding:12px;display:flex;flex-direction:column;gap:10px}
.reqline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--mono);font-size:12.5px}
.reqline .u{flex:1;min-width:200px;overflow-wrap:anywhere}
.copy{font:inherit;font-size:12px;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer;font-family:var(--sans)}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pane{min-width:0}
.pane h5{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
pre{margin:0;background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;overflow:auto;max-height:320px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
pre.hdr{max-height:140px;color:var(--text-2)}
.jk{color:var(--jk)} .js{color:var(--js)} .jn{color:var(--jn)} .jb{color:var(--jb)}
.errline{background:var(--fail-row);color:var(--fail);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.timenote{font-size:12px;color:var(--muted)}
.shot{display:block;max-width:100%;border:1px solid var(--line);border-radius:6px}
.trace{font-size:13px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.trace code{font-size:12px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;padding:6px 8px}
.visual{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.visual figure{margin:0;display:flex;flex-direction:column;gap:4px}
.visual figcaption{font-size:12px;color:var(--muted)}
.visual img{display:block;max-width:100%;border:1px solid var(--line);border-radius:6px}
details.raw>summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.raw pre{margin-top:8px}
.gaps{display:flex;flex-direction:column}
.gaprow{display:grid;grid-template-columns:1fr auto;gap:14px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.gaprow .e{font-family:var(--mono);font-size:12px;color:var(--muted);display:block}
.gaprow .cnt{font-size:12px;color:var(--warn);white-space:nowrap}
footer{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}

@media (max-width:720px){
  .wrap{padding:0 16px}
  .verdict{padding:20px}
  .card{padding:16px}
  .compare>div+div{border-left:none;padding-left:0;border-top:1px solid var(--line-soft);padding-top:16px}
  details.case>summary{grid-template-columns:72px minmax(0,1fr)}
  .pills{display:none}
  details.step>summary{grid-template-columns:50px minmax(0,1fr) 46px}
  .ms{display:none}
  .mixrow{grid-template-columns:72px 1fr 96px}
  .chg{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  .filters,.copy{display:none}
  details{break-inside:avoid}
}
</style>
