<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" role="img" aria-label="日常工作流：从 PR 到门禁，失败先分清是用例错还是产品错">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
    <style>
      .bx { fill: none; stroke: #c9ced6; stroke-width: 1.25; }
      .main { fill: #2d7ff9; fill-opacity: .10; stroke: #2d7ff9; stroke-width: 2; }
      .t { fill: #16181d; font-size: 15px; }
      .tb { fill: #16181d; font-size: 15px; font-weight: 600; }
      .q { fill: #6b7280; font-size: 13px; }
      .ln { fill: none; stroke: #8a8f98; stroke-width: 1.25; }
      @media (prefers-color-scheme: dark) {
        .t, .tb { fill: #e8eaed; }
        .q { fill: #9aa0a6; }
        .bx { stroke: #4a4f57; }
        .ln { stroke: #8a8f98; }
      }
    </style>
  </defs>

  <text x="24" y="34" class="tb" font-size="20">执行交给 CI，失败先分清是用例错还是产品错</text>

  <g class="ln">
    <path d="M186 102H206" marker-end="url(#w)"/>
    <path d="M370 102H390" marker-end="url(#w)"/>
    <path d="M554 102H574" marker-end="url(#w)"/>
    <path d="M658 128V188" marker-end="url(#w)"/>
    <path d="M658 266V312" marker-end="url(#w)"/>
    <path d="M582 228H556" marker-end="url(#w)"/>
    <path d="M394 228H370" marker-end="url(#w)"/>
    <path d="M290 190V128" marker-end="url(#w)"/>
    <path d="M214 228H188" marker-end="url(#w)"/>
  </g>

  <g><rect x="26" y="76" width="160" height="52" rx="8" class="bx"/>
    <text x="106" y="108" text-anchor="middle" class="t">PR 或需求</text></g>
  <g><rect x="210" y="76" width="160" height="52" rx="8" class="bx"/>
    <text x="290" y="108" text-anchor="middle" class="t">AI 写或改用例</text></g>
  <g><rect x="394" y="76" width="160" height="52" rx="8" class="bx"/>
    <text x="474" y="108" text-anchor="middle" class="t">人 review 后合入</text></g>
  <g><rect x="578" y="76" width="160" height="52" rx="8" class="bx"/>
    <text x="658" y="108" text-anchor="middle" class="t">CI 调 CLI 执行</text></g>

  <g><polygon points="582,228 658,190 734,228 658,266" class="bx"/>
    <text x="658" y="233" text-anchor="middle" class="tb">全部通过？</text></g>
  <g><rect x="578" y="314" width="160" height="52" rx="8" class="main"/>
    <text x="658" y="346" text-anchor="middle" class="tb">门禁放行</text></g>

  <g><rect x="394" y="202" width="160" height="52" rx="8" class="bx"/>
    <text x="474" y="234" text-anchor="middle" class="t">AI 分析失败原因</text></g>
  <g><polygon points="214,228 290,190 366,228 290,266" class="bx"/>
    <text x="290" y="233" text-anchor="middle" class="tb">用例写错？</text></g>
  <g><rect x="26" y="202" width="160" height="52" rx="8" class="bx"/>
    <text x="106" y="234" text-anchor="middle" class="t">提 bug 给开发</text></g>

  <text x="670" y="296" class="q">是</text>
  <text x="566" y="218" text-anchor="middle" class="q">否</text>
  <text x="302" y="166" class="q">是，改用例</text>
  <text x="200" y="218" text-anchor="middle" class="q">否</text>
</svg>
