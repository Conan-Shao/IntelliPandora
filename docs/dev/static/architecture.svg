<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" role="img" aria-label="IntelliPandora 架构：入口、执行、资产、评测四层">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
    <style>
      .bx { fill: none; stroke: #c9ced6; stroke-width: 1.25; }
      .main { fill: #2d7ff9; fill-opacity: .10; stroke: #2d7ff9; stroke-width: 2; }
      .zone { fill: #f4f5f7; stroke: #c9ced6; stroke-width: 1.25; }
      .t { fill: #16181d; font-size: 16px; }
      .tb { fill: #16181d; font-size: 16px; font-weight: 600; }
      .q { fill: #6b7280; font-size: 13.5px; }
      .ln { fill: none; stroke: #8a8f98; stroke-width: 1.25; }
      @media (prefers-color-scheme: dark) {
        .t, .tb { fill: #e8eaed; }
        .q { fill: #9aa0a6; }
        .bx { stroke: #4a4f57; }
        .zone { fill: #22252a; stroke: #4a4f57; }
        .ln { stroke: #8a8f98; }
      }
    </style>
  </defs>

  <text x="24" y="34" class="tb" font-size="20">agent 只管写，用例由 IntelliPandora 执行</text>

  <g class="ln">
    <path d="M86 122V160" marker-end="url(#a)"/>
    <path d="M222 122V160" marker-end="url(#a)"/>
    <path d="M412 122V160" marker-end="url(#a)"/>
    <path d="M148 228V264" marker-end="url(#a)"/>
    <path d="M404 228V264" marker-end="url(#a)"/>
    <path d="M526 196H590" stroke-dasharray="4 4"/>
  </g>

  <g>
    <rect x="26" y="62" width="120" height="60" rx="8" class="bx"/>
    <text x="86" y="98" text-anchor="middle" class="t">人</text>
  </g>
  <g>
    <rect x="162" y="62" width="120" height="60" rx="8" class="bx"/>
    <text x="222" y="98" text-anchor="middle" class="t">CI</text>
  </g>
  <g>
    <rect x="298" y="62" width="228" height="60" rx="8" class="bx"/>
    <text x="412" y="88" text-anchor="middle" class="tb">agent</text>
    <text x="412" y="110" text-anchor="middle" class="q">MCP · Claude Code + 测试插件</text>
  </g>
  <text x="550" y="97" class="q">三个入口共用同一个 runner</text>

  <g>
    <rect x="26" y="162" width="500" height="66" rx="8" class="main"/>
    <text x="276" y="189" text-anchor="middle" class="tb">IntelliPandora 执行器（独立 CLI）</text>
    <text x="276" y="212" text-anchor="middle" class="t" font-size="13.5">协议 · 断言 · 归因 · 录制回放 · 报告 + JUnit XML</text>
  </g>
  <text x="558" y="188" text-anchor="middle" class="q">按需对接</text>
  <g>
    <rect x="590" y="162" width="146" height="66" rx="8" class="bx"/>
    <text x="663" y="189" text-anchor="middle" class="tb" font-size="15">Java 接口平台</text>
    <text x="663" y="211" text-anchor="middle" class="q">团队已有</text>
  </g>

  <g>
    <rect x="26" y="266" width="244" height="58" rx="8" class="bx"/>
    <text x="148" y="290" text-anchor="middle" class="tb" font-size="15">私有仓库</text>
    <text x="148" y="311" text-anchor="middle" class="q">用例 · 业务 Flow · 配置</text>
  </g>
  <g>
    <rect x="282" y="266" width="244" height="58" rx="8" class="bx"/>
    <text x="404" y="290" text-anchor="middle" class="tb" font-size="15">测试数据和账号池</text>
    <text x="404" y="311" text-anchor="middle" class="q">固定账号 · 状态归一</text>
  </g>

  <g>
    <rect x="26" y="358" width="710" height="118" rx="8" class="zone"/>
    <text x="42" y="384" class="tb" font-size="15">评测层（Python + Inspect，跑在 Docker 里）</text>
    <rect x="42" y="400" width="332" height="58" rx="8" class="bx"/>
    <text x="208" y="424" text-anchor="middle" class="tb" font-size="15">评测试插件</text>
    <text x="208" y="445" text-anchor="middle" class="q">生成的用例能不能抓住注入的错误</text>
    <rect x="390" y="400" width="332" height="58" rx="8" class="bx"/>
    <text x="556" y="424" text-anchor="middle" class="tb" font-size="15">评 agentic wallet</text>
    <text x="556" y="445" text-anchor="middle" class="q">意图 · 执行结果 · 安全 · 信息准确</text>
  </g>
</svg>
