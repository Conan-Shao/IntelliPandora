# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      # A credential lived in runtime.py from the first public commit onward,
      # shipped in every release and every PyPI sdist. This is here so that
      # cannot happen again.
      # No `exclude: ^docs/` any more. The one design doc that quotes the
      # leaked line as evidence carries an inline `pragma: allowlist secret`
      # instead, so a secret pasted into any other doc is still caught.
      # `types: [text]` is dropped too: the Fernet key this framework writes is
      # raw bytes, which pre-commit classifies as binary and would skip -- and
      # a key file is exactly what must not slip through.
      - id: no-hardcoded-secrets
        name: no hardcoded secrets
        entry: scripts/check_secrets.py
        language: script

      - id: core-must-not-import-ai
        name: core/ must not import ai/
        entry: scripts/check_layering.py
        language: script
        pass_filenames: false
