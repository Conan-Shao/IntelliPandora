[metadata]
description-file = README.md

[bdist_wheel]
universal=0

# Every entry below is imported somewhere in src/. Eight that were not --
# websockets, bs4, six, tabulate, retrying, assertpy, pymysql and twine --
# were removed: each one was install-time code execution bought for nothing,
# and `twine` is a publishing tool that had no business being a runtime
# dependency at all. pendulum went with common/timeutils.py, its only user.
#
# Versions are bounded on both sides. The floor is what the code needs, the
# ceiling is the next major: a dependency that silently moves across a major
# makes a run's result depend on when it was installed, which is the opposite
# of what a test framework is for. See docs/design/decisions/10-迭代方案.md.
[options]
install_requires =
    requests>=2.31,<3
    urllib3>=2.0,<3
    PyYAML>=6.0,<7
    cryptography>=42.0,<51
    pluggy>=1.3,<2
    Jinja2>=3.1,<4
    jsonschema>=4.20,<5
    pytest>=7.4,<10

# Mutation testing. The suite's job is to fail when the code is wrong, and the
# only way to know it does is to break the code on purpose and watch. Scope a
# run with scripts/mutation.py -- mutating all of src/ at once takes hours.
[mutmut]
source_paths = src/ipandora
# mutmut runs the suite from a copy of the project, so anything a test reaches
# for by repo-relative path has to come along. test/testcrypto shells out to
# scripts/check_secrets.py, and without this it fails for a reason that has
# nothing to do with the mutant. Tests also read the component registry and
# the CI workflow (the admitted elle-cli hash must match both), and the
# evaluation examples the eval tests load as specs.
also_copy =
    scripts
    setup.py
    setup.cfg
    docs
    .github
    examples
do_not_mutate =
    src/ipandora/conf/*
